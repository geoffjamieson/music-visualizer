<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css" />
    <title>Music Visualizer</title>
  </head>
  <body>
    <main>
      <p id="library-status">Checking your music library ...</p>

      <form id="settings-form">
        <label for="music-dir">Music Folder</label>
        <input
          type="text"
          id="music-dir"
          placeholder="/Users/you/Music/My Library"
          required
        />
        <button type="submit">Save</button>
        <p id="settings-error"></p>
      </form>

      <p id="currently-playing"></p>

      <audio id="player" controls></audio>

      <div>
        <button id="prev">Previous</button>
        <button id="next">Next</button>
        <button id="repeat">Repeat: off</button>
      </div>

      <ul id="playlist"></ul>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
